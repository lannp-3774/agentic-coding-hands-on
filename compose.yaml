# Runs the Next.js app at http://localhost:3000.
# Supabase must be running first: `npx supabase start` (its containers restart
# with Docker on their own). Then: `docker compose up -d --build`.
services:
  web:
    build: .
    image: my-app-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    # SUPABASE_URL=http://127.0.0.1:54321 works as is: the image forwards that
    # port to the host's Supabase (see Dockerfile).
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
